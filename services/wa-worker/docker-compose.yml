version: '3.8'

services:
  wa-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowyn-wa-worker
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - FLOWYN_URL=${FLOWYN_URL}
      - WORKER_SECRET=${WORKER_SECRET}
      - MAX_SESSIONS_PER_WORKER=25
      - SESSION_RESTART_HOURS=4
      - MESSAGE_DELAY_MIN_MS=2000
      - MESSAGE_DELAY_MAX_MS=5000
    volumes:
      - wa-auth:/app/auth
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: flowyn-wa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  wa-auth:
    driver: local
  redis-data:
    driver: local
